<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | EduMatch</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f8fc;
            color: #172033;
            min-height: 100vh;
        }

        header {
            background: #172033;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #947cff;
        }

        a {
            text-decoration: none;
        }

        .back {
            background: #7657ff;
            color: white;
            padding: 11px 16px;
            border-radius: 8px;
        }

        main {
            max-width: 900px;
            margin: 35px auto;
            padding: 20px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #697386;
        }

        button {
            cursor: pointer;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
        }

        .mark-all {
            background: #7657ff;
            color: white;
        }

        .list {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px #1720330d;
            overflow: hidden;
        }

        .notification {
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            border-bottom: 1px solid #edf0f5;
        }

        .notification.unread {
            background: #f4f1ff;
            border-left: 4px solid #7657ff;
        }

        .content {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .content h3 {
            margin-bottom: 8px;
        }

        .content p {
            color: #697386;
            line-height: 1.6;
        }

        .content small {
            display: block;
            color: #858da0;
            margin-top: 10px;
        }

        .badge {
            display: inline-block;
            background: #7657ff;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .read {
            background: #e8e3ff;
            color: #5437d2;
        }

        .delete {
            background: #ffe9e9;
            color: #b42323;
        }

        .empty {
            padding: 65px 20px;
            text-align: center;
        }

        .empty .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #697386;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            main {
                padding: 15px;
            }

            .notification {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="../theme.css">
</head>

<body>

<header>
    <div class="logo">Edu<span>Match</span></div>
    <a class="back" href="dashboard.html">← Dashboard</a>
</header>

<main>
    <div class="heading">
        <div>
            <h1>Notifications</h1>
            <p class="subtitle" id="summary">
                You have no unread notifications.
            </p>
        </div>

        <button class="mark-all" id="markAll">
            Mark All as Read
        </button>
    </div>

    <section class="list" id="notificationList">
        <div class="empty">
            <div class="icon">🔔</div>
            <h2>You're all caught up!</h2>
            <p>
                Your notifications will appear here when they become available.
            </p>
        </div>
    </section>
</main>

<script>
    const STORAGE_KEY = "edumatchNotifications";

    const list = document.getElementById("notificationList");
    const summary = document.getElementById("summary");

    function getNotifications() {
        try {
            const data = JSON.parse(
                localStorage.getItem(STORAGE_KEY) || "[]"
            );

            return Array.isArray(data) ? data : [];
        } catch (error) {
            console.error("Unable to load notifications:", error);
            return [];
        }
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    function render() {
        const notifications = getNotifications();

        const unreadCount = notifications.filter(
            notification => !notification.read
        ).length;

        summary.textContent = unreadCount
            ? `You have ${unreadCount} unread notification(s).`
            : "You have no unread notifications.";

        if (notifications.length === 0) {
            list.innerHTML = `
                <div class="empty">
                    <div class="icon">🔔</div>
                    <h2>You're all caught up!</h2>
                    <p>
                        Your notifications will appear here
                        when they become available.
                    </p>
                </div>
            `;
            return;
        }

        list.innerHTML = notifications.map(item => `
            <article class="notification ${item.read ? "" : "unread"}">
                <div class="content">
                    ${item.read ? "" : '<span class="badge">UNREAD</span>'}
                    <h3>${escapeHTML(item.title || "Notification")}</h3>
                    <p>${escapeHTML(item.message || "")}</p>
                    <small>${escapeHTML(item.date || "")}</small>
                </div>

                <div class="actions">
                    ${item.read ? "" : `
                        <button class="read"
                            data-action="read"
                            data-id="${escapeHTML(item.id)}">
                            Mark Read
                        </button>
                    `}

                    <button class="delete"
                        data-action="delete"
                        data-id="${escapeHTML(item.id)}">
                        Delete
                    </button>
                </div>
            </article>
        `).join("");
    }

    list.addEventListener("click", function(event) {
        const button = event.target.closest("button[data-action]");

        if (!button) return;

        const id = button.dataset.id;
        const action = button.dataset.action;

        let notifications = getNotifications();

        if (action === "read") {
            notifications = notifications.map(item =>
                String(item.id) === id
                    ? { ...item, read: true }
                    : item
            );
        } else if (action === "delete") {
            notifications = notifications.filter(
                item => String(item.id) !== id
            );
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(notifications));
        render();
    });

    document.getElementById("markAll").addEventListener("click", function() {
        const notifications = getNotifications().map(item => ({
            ...item,
            read: true
        }));

        localStorage.setItem(STORAGE_KEY, JSON.stringify(notifications));
        render();
    });

    render();
</script>

    <script src="../theme.js"></script>
</body>
</html>
