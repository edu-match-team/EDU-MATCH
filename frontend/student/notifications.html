<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | EduMatch</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f8fc;
            color: #172033;
            min-height: 100vh;
        }

        header {
            background: #172033;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #947cff;
        }

        a {
            text-decoration: none;
        }

        .back {
            background: #7657ff;
            color: white;
            padding: 11px 16px;
            border-radius: 8px;
        }

        main {
            max-width: 900px;
            margin: 35px auto;
            padding: 20px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #697386;
        }

        button {
            cursor: pointer;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
        }

        .mark-all {
            background: #7657ff;
            color: white;
        }

        .list {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px #1720330d;
            overflow: hidden;
        }

        .notification {
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            border-bottom: 1px solid #edf0f5;
        }

        .notification.unread {
            background: #f4f1ff;
            border-left: 4px solid #7657ff;
        }

        .content {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .content h3 {
            margin-bottom: 8px;
        }

        .content p {
            color: #697386;
            line-height: 1.6;
        }

        .content small {
            display: block;
            color: #858da0;
            margin-top: 10px;
        }

        .badge {
            display: inline-block;
            background: #7657ff;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .read {
            background: #e8e3ff;
            color: #5437d2;
        }

        .delete {
            background: #ffe9e9;
            color: #b42323;
        }

        .empty {
            padding: 65px 20px;
            text-align: center;
        }

        .empty .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #697386;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            main {
                padding: 15px;
            }

            .notification {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="../theme.css">
</head>

<body>

<header>
    <div class="logo">Edu<span>Match</span></div>
    <a class="back" href="dashboard.html">← Dashboard</a>
</header>

<main>
    <div class="heading">
        <div>
            <h1>Notifications</h1>
            <p class="subtitle" id="summary">
                You have no unread notifications.
            </p>
        </div>

        <button class="mark-all" id="markAll">
            Mark All as Read
        </button>
    </div>

    <section class="list" id="notificationList">
        <div class="empty">
            <div class="icon">🔔</div>
            <h2>You're all caught up!</h2>
            <p>
                Your notifications will appear here when they become available.
            </p>
        </div>
    </section>
</main>

<script>
    const STORAGE_KEY = "edumatchNotifications";
    const API_BASE = (typeof window !== "undefined" && window.location && window.location.protocol.startsWith("http"))
        ? (window.location.port === "5500" || window.location.port === "5173"
            ? `${window.location.protocol}//${window.location.hostname}:5000/api`
            : window.location.origin + "/api")
        : "http://127.0.0.1:5000/api";

    const list = document.getElementById("notificationList");
    const summary = document.getElementById("summary");

    let liveNotifications = [];

    function escapeHTML(value) {
        return String(value || "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    async function loadNotifications() {
        const token = localStorage.getItem("edumatch_token");
        const userRaw = localStorage.getItem("eduMatchUser");
        const user = userRaw ? JSON.parse(userRaw) : null;

        const headers = { "Accept": "application/json" };
        if (token) headers["Authorization"] = token.startsWith("Bearer ") ? token : ("Bearer " + token);
        if (user && user.id) headers["X-User-Id"] = String(user.id);

        try {
            const url = `${API_BASE}/notifications` + (user && user.id ? `?user_id=${user.id}` : "");
            const res = await fetch(url, { headers, credentials: "include" });
            if (res.ok) {
                const data = await res.json();
                liveNotifications = data.notifications || [];
            }
        } catch(e) {
            console.warn("Could not load backend notifications, using local cache:", e);
        }

        if (liveNotifications.length === 0) {
            try {
                liveNotifications = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            } catch (err) {}
        }

        render();
    }

    function render() {
        const unreadCount = liveNotifications.filter(n => !n.is_read && !n.read).length;

        summary.textContent = unreadCount
            ? `You have ${unreadCount} unread notification(s).`
            : "You have no unread notifications. All caught up!";

        if (liveNotifications.length === 0) {
            list.innerHTML = `
                <div class="empty">
                    <div class="icon">🔔</div>
                    <h2>You're all caught up!</h2>
                    <p>
                        Your notifications will appear here when you receive project updates or messages.
                    </p>
                </div>
            `;
            return;
        }

        list.innerHTML = liveNotifications.map(item => {
            const isRead = item.is_read || item.read;
            return `
            <article class="notification ${isRead ? "" : "unread"}">
                <div class="content">
                    ${isRead ? "" : '<span class="badge" style="background:#7657ff;color:white;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;margin-right:6px;">NEW</span>'}
                    <h3>${escapeHTML(item.title || "Notification")}</h3>
                    <p>${escapeHTML(item.message || "")}</p>
                    <small>${escapeHTML(item.created_at || item.date || "")}</small>
                </div>

                <div class="actions">
                    ${isRead ? "" : `
                        <button class="read"
                            data-action="read"
                            data-id="${escapeHTML(item.id)}">
                            ✓ Mark Read
                        </button>
                    `}
                    ${item.link ? `
                        <a href="${item.link}" class="read" style="text-decoration:none;display:inline-block;padding:7px 12px;background:#ede9fe;color:#6d28d9;border-radius:6px;font-size:12px;font-weight:700;">
                            Open →
                        </a>
                    ` : ""}
                </div>
            </article>
            `;
        }).join("");
    }

    list.addEventListener("click", async function(event) {
        const button = event.target.closest("button[data-action]");
        if (!button) return;

        const id = button.dataset.id;
        const action = button.dataset.action;

        if (action === "read") {
            liveNotifications = liveNotifications.map(item =>
                String(item.id) === id
                    ? { ...item, is_read: 1, read: true }
                    : item
            );
            render();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(liveNotifications));

            // Sync with backend
            try {
                const token = localStorage.getItem("edumatch_token");
                const headers = { "Content-Type": "application/json" };
                if (token) headers["Authorization"] = token.startsWith("Bearer ") ? token : ("Bearer " + token);
                await fetch(`${API_BASE}/notifications/mark-read`, {
                    method: "POST",
                    credentials: "include",
                    headers: headers
                });
            } catch(e) {}
        }
    });

    document.getElementById("markAll").addEventListener("click", async function() {
        liveNotifications = liveNotifications.map(item => ({
            ...item,
            is_read: 1,
            read: true
        }));

        render();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(liveNotifications));

        try {
            const token = localStorage.getItem("edumatch_token");
            const userRaw = localStorage.getItem("eduMatchUser");
            const user = userRaw ? JSON.parse(userRaw) : null;
            const headers = { "Content-Type": "application/json" };
            if (token) headers["Authorization"] = token.startsWith("Bearer ") ? token : ("Bearer " + token);
            if (user && user.id) headers["X-User-Id"] = String(user.id);

            await fetch(`${API_BASE}/notifications/mark-read`, {
                method: "POST",
                credentials: "include",
                headers: headers,
                body: JSON.stringify({ user_id: user ? user.id : null })
            });
        } catch(e) {}
    });

    loadNotifications();
</script>

    <script src="../theme.js"></script>
</body>
</html>
