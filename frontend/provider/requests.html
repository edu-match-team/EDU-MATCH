<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Requests | EduMatch</title>

    <style>
        :root {
            --primary: #6c4df6;
            --primary-dark: #5535df;
            --bg: #f7f7fc;
            --white: #ffffff;
            --text: #24213b;
            --muted: #77758e;
            --border: #e8e5f0;
            --green: #15803d;
            --red: #dc2626;
            --orange: #b45309;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button, input, select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 245px;
            background: white;
            border-right: 1px solid var(--border);
            padding: 27px 16px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            z-index: 100;
            transition: transform .25s;
        }

        .logo {
            font-size: 26px;
            font-weight: 850;
            letter-spacing: -1px;
            padding: 0 13px;
            margin-bottom: 38px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-label {
            color: #a09caf;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.3px;
            padding: 0 13px;
            margin-bottom: 12px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 650;
            color: var(--muted);
            margin-bottom: 5px;
            transition: .2s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #f0ecff;
            color: var(--primary);
        }

        .nav-icon {
            width: 22px;
            text-align: center;
            font-size: 16px;
        }

        .main {
            width: calc(100% - 245px);
            margin-left: 245px;
        }

        .topbar {
            height: 76px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 34px;
        }

        .topbar h2 {
            font-size: 19px;
        }

        .topbar p {
            color: var(--muted);
            font-size: 11px;
            margin-top: 5px;
        }

        .provider-badge {
            background: #eee9ff;
            color: var(--primary);
            padding: 10px 15px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 800;
        }

        .content {
            padding: 32px;
            max-width: 1500px;
            margin: auto;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 26px;
        }

        .page-heading h1 {
            font-size: 27px;
            letter-spacing: -.7px;
            margin-bottom: 8px;
        }

        .page-heading p {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.7;
        }

        .refresh-btn {
            padding: 12px 17px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 750;
        }

        .filters {
            display: flex;
            gap: 13px;
            margin-bottom: 24px;
        }

        .filters input,
        .filters select {
            background: white;
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 13px 14px;
            outline: none;
            font-size: 12px;
            color: var(--text);
        }

        .filters input {
            flex: 1;
            min-width: 0;
        }

        .filters input:focus,
        .filters select:focus {
            border-color: var(--primary);
        }

        .request-list {
            display: grid;
            gap: 17px;
        }

        .request-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 23px;
            transition: .2s;
        }

        .request-card:hover {
            border-color: #d4c9ff;
            box-shadow: 0 7px 25px rgba(42, 30, 90, .04);
        }

        .request-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
        }

        .request-top h3 {
            font-size: 16px;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .request-meta {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.9;
        }

        .status {
            display: inline-block;
            border-radius: 20px;
            padding: 7px 11px;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
            background: #f1f0f7;
            color: #656179;
        }

        .status.pending {
            background: #fff7ed;
            color: var(--orange);
        }

        .status.accepted {
            background: #f0fdf4;
            color: var(--green);
        }

        .status.rejected,
        .status.cancelled {
            background: #fef2f2;
            color: var(--red);
        }

        .request-description {
            font-size: 12px;
            line-height: 1.8;
            color: #625f78;
            margin: 18px 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .request-details {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
            padding: 15px 0;
            border-top: 1px solid #f0eef6;
            border-bottom: 1px solid #f0eef6;
        }

        .detail-item small {
            display: block;
            color: var(--muted);
            font-size: 10px;
            margin-bottom: 7px;
        }

        .detail-item strong {
            font-size: 12px;
        }

        .request-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 11px 15px;
            font-size: 11px;
            font-weight: 750;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-danger {
            background: #fef2f2;
            color: var(--red);
        }

        .btn-outline {
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .notice {
            padding: 16px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.7;
            margin-bottom: 18px;
            display: none;
            overflow-wrap: anywhere;
        }

        .notice.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
        }

        .notice.info {
            display: block;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .empty-state {
            background: white;
            border: 1px dashed #d9d4e8;
            border-radius: 14px;
            padding: 55px 20px;
            text-align: center;
        }

        .empty-state .icon {
            font-size: 34px;
            margin-bottom: 14px;
        }

        .empty-state h3 {
            font-size: 16px;
            margin-bottom: 9px;
        }

        .empty-state p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.8;
        }

        .mobile-menu {
            display: none;
            border: none;
            background: transparent;
            font-size: 23px;
            margin-right: 12px;
        }

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: 10px 0 40px #00000012;
            }

            .main {
                width: 100%;
                margin-left: 0;
            }

            .mobile-menu {
                display: inline-block;
            }

            .topbar {
                padding: 0 20px;
            }

            .content {
                padding: 25px 18px;
            }
        }

        @media (max-width: 560px) {
            .page-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .filters {
                flex-direction: column;
            }

            .request-card {
                padding: 17px;
            }

            .request-top {
                flex-direction: column;
            }

            .request-details {
                gap: 18px;
            }
        }
    </style>
    <link rel="stylesheet" href="../theme.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar" id="sidebar">

        <a href="dashboard.html" class="logo">
            Edu<span>Match</span>
        </a>

        <div class="nav-label">WORKSPACE</div>

        <a href="dashboard.html" class="nav-link">
            <span class="nav-icon">⌂</span> Dashboard
        </a>

        <a href="profile.html" class="nav-link">
            <span class="nav-icon">◎</span> My Profile
        </a>

        <a href="skills.html" class="nav-link">
            <span class="nav-icon">✿</span> My Skills
        </a>

        <a href="requests.html" class="nav-link active">
            <span class="nav-icon">♧</span> Project Requests
        </a>

        <a href="orders.html" class="nav-link">
            <span class="nav-icon">▤</span> My Orders
        </a>

        <a href="chat.html" class="nav-link">
            <span class="nav-icon">✉</span> Messages
        </a>

        <a href="../index.html" class="nav-link">
            <span class="nav-icon">←</span> Back to Website
        </a>

        <a href="login.html" class="nav-link" id="logoutLink" style="color:#dc2626; margin-top:25px;">
            <span class="nav-icon">⇥</span> Log Out
        </a>

    </aside>

    <main class="main">

        <header class="topbar">

            <div style="display:flex;align-items:center;">
                <button class="mobile-menu" id="menuToggle"
                        aria-label="Toggle navigation">☰</button>

                <div>
                    <h2>Student Requests</h2>
                    <p>Review requests submitted to your services.</p>
                </div>
            </div>

            <div class="provider-badge">PROVIDER WORKSPACE</div>

        </header>

        <div class="content">

            <div class="page-heading">
                <div>
                    <h1>Project Requests</h1>
                    <p>Review actual student requirements and respond to them.</p>
                </div>

                <button class="refresh-btn" id="refreshButton">
                    ↻ Refresh
                </button>
            </div>

            <div id="notice" class="notice"></div>

            <div class="filters">

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search by project, student, or requirement..."
                    aria-label="Search requests"
                >

                <select id="statusFilter" aria-label="Filter by status">
                    <option value="all">All statuses</option>
                    <option value="pending">Pending</option>
                    <option value="accepted">Accepted</option>
                    <option value="rejected">Rejected</option>
                    <option value="cancelled">Cancelled</option>
                </select>

            </div>

            <div id="requestList" class="request-list"></div>

        </div>

    </main>

</div>

<script>
    const API_BASE_URL = "http://127.0.0.1:5000/api";

    const requestList = document.getElementById("requestList");
    const notice = document.getElementById("notice");

    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");

    let requests = [];

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    function getToken() {
        return localStorage.getItem("edumatch_token");
    }

    function setNotice(message, type = "info") {
        notice.textContent = message;
        notice.className = "notice " + type;
    }

    function clearNotice() {
        notice.textContent = "";
        notice.className = "notice";
    }

    function formatDate(value) {
        if (!value) return "Not specified";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return String(value);
        }

        return date.toLocaleDateString(undefined, {
            day: "numeric",
            month: "short",
            year: "numeric"
        });
    }

    function formatAmount(value) {
        if (value === null || value === undefined || value === "") {
            return "Not specified";
        }

        const amount = Number(value);

        if (!Number.isFinite(amount)) {
            return "Not specified";
        }

        return new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 2
        }).format(amount);
    }

    async function apiRequest(path, options = {}) {
        const token = getToken();

        const headers = {
            "Content-Type": "application/json",
            ...(options.headers || {})
        };

        if (token) {
            headers.Authorization = `Bearer ${token}`;
        }

        const response = await fetch(API_BASE_URL + path, {
            ...options,
            headers,
            credentials: "include"
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.message ||
                data.error ||
                `Request failed (HTTP ${response.status}).`
            );
        }

        return data;
    }

    function getStatusClass(status) {
        const normalized = String(status || "").toLowerCase();

        if (normalized === "pending") return "pending";
        if (normalized === "accepted") return "accepted";
        if (normalized === "rejected") return "rejected";
        if (normalized === "cancelled") return "cancelled";

        return "";
    }

    function renderRequests() {
        const query = searchInput.value.trim().toLowerCase();
        const selectedStatus = statusFilter.value;

        const filtered = requests.filter(request => {
            const studentName =
                request.student?.name ||
                request.student_name ||
                "";

            const searchable = [
                request.service_title,
                request.title,
                request.description,
                request.requirements,
                studentName
            ].join(" ").toLowerCase();

            const status = String(request.status || "").toLowerCase();

            return searchable.includes(query) &&
                (selectedStatus === "all" || status === selectedStatus);
        });

        if (filtered.length === 0) {
            requestList.innerHTML = `
                <div class="empty-state">
                    <div class="icon">⌕</div>
                    <h3>No matching requests</h3>
                    <p>
                        No requests match your current search and filter.
                        If you have not received any requests yet, they will
                        appear here after students submit real requirements.
                    </p>
                </div>
            `;
            return;
        }

        requestList.innerHTML = filtered.map(request => {
            const id = request.id;
            const title = request.service_title ||
                request.title ||
                "Untitled request";

            const student = request.student?.name ||
                request.student_name ||
                "Student";

            const status = String(request.status || "pending").toLowerCase();

            const description = request.description ||
                request.requirements ||
                "No additional description was provided.";

            const budget = request.budget ?? request.amount;

            const canRespond = status === "pending";

            return `
                <article class="request-card">

                    <div class="request-top">
                        <div>
                            <h3>${escapeHTML(title)}</h3>
                            <div class="request-meta">
                                Student: ${escapeHTML(student)}<br>
                                Request ID: ${escapeHTML(id)}
                            </div>
                        </div>

                        <span class="status ${getStatusClass(status)}">
                            ${escapeHTML(status)}
                        </span>
                    </div>

                    <div class="request-description">
                        ${escapeHTML(description)}
                    </div>

                    <div class="request-details">

                        <div class="detail-item">
                            <small>Student Budget</small>
                            <strong>${escapeHTML(formatAmount(budget))}</strong>
                        </div>

                        <div class="detail-item">
                            <small>Deadline</small>
                            <strong>${escapeHTML(formatDate(
                                request.deadline ||
                                request.delivery_date
                            ))}</strong>
                        </div>

                        <div class="detail-item">
                            <small>Received On</small>
                            <strong>${escapeHTML(formatDate(
                                request.created_at
                            ))}</strong>
                        </div>

                    </div>

                    <div class="request-actions">

                        <button class="btn btn-outline"
                            data-action="details"
                            data-id="${escapeHTML(id)}">
                            View Details
                        </button>

                        ${canRespond ? `
                            <button class="btn btn-primary"
                                data-action="accept"
                                data-id="${escapeHTML(id)}">
                                Accept Request
                            </button>

                            <button class="btn btn-danger"
                                data-action="reject"
                                data-id="${escapeHTML(id)}">
                                Reject Request
                            </button>
                        ` : ""}

                    </div>

                </article>
            `;
        }).join("");
    }

    async function loadRequests() {
        clearNotice();

        requestList.innerHTML = `
            <div class="empty-state">
                <h3>Loading requests...</h3>
                <p>Retrieving requests from the EduMatch server.</p>
            </div>
        `;

        try {
            /*
              Required backend endpoint:
              GET /api/provider/requests

              Expected response:
              { "requests": [...] }
            */

            const data = await apiRequest("/provider/requests");

            if (!Array.isArray(data.requests)) {
                throw new Error(
                    "The server response does not contain a requests array."
                );
            }

            requests = data.requests;

            renderRequests();

        } catch (error) {
            requests = [];

            requestList.innerHTML = `
                <div class="empty-state">
                    <div class="icon">!</div>
                    <h3>Requests could not be loaded</h3>
                    <p>${escapeHTML(error.message)}</p>
                    <br>
                    <p>
                        Check that the Flask backend is running and that
                        GET /api/provider/requests is implemented.
                    </p>
                </div>
            `;

            setNotice(
                "The request list could not be retrieved from the server. " +
                "No sample requests have been added.",
                "error"
            );
        }
    }

    async function respondToRequest(id, action) {
        const request = requests.find(item => String(item.id) === String(id));

        if (!request) {
            setNotice("This request is no longer available in the current list.", "error");
            return;
        }

        if (String(request.status).toLowerCase() !== "pending") {
            setNotice("Only pending requests can be accepted or rejected.", "error");
            return;
        }

        const label = action === "accept" ? "accept" : "reject";

        if (!confirm(`Are you sure you want to ${label} this request?`)) {
            return;
        }

        const buttons = requestList.querySelectorAll(
            `[data-id="${CSS.escape(String(id))}"]`
        );

        buttons.forEach(button => button.disabled = true);

        try {
            /*
              Required backend endpoint:
              PATCH /api/provider/requests/<id>

              JSON body:
              { "status": "accepted" }
              or
              { "status": "rejected" }

              The backend must verify provider ownership and that
              the request is still pending before changing its status.
            */

            await apiRequest(
                `/provider/requests/${encodeURIComponent(id)}`,
                {
                    method: "PATCH",
                    body: JSON.stringify({
                        status: action === "accept" ? "accepted" : "rejected"
                    })
                }
            );

            setNotice(
                `The request was ${action === "accept" ? "accepted" : "rejected"}.`,
                "info"
            );

            await loadRequests();

        } catch (error) {
            setNotice(error.message, "error");

            buttons.forEach(button => button.disabled = false);
        }
    }

    requestList.addEventListener("click", async event => {
        const button = event.target.closest("button[data-action]");

        if (!button) return;

        const id = button.dataset.id;
        const action = button.dataset.action;

        if (action === "accept" || action === "reject") {
            await respondToRequest(id, action);
            return;
        }

        if (action === "details") {
            window.location.href =
                `order-details.html?request_id=${encodeURIComponent(id)}`;
        }
    });

    searchInput.addEventListener("input", renderRequests);
    statusFilter.addEventListener("change", renderRequests);

    document.getElementById("refreshButton").addEventListener(
        "click",
        loadRequests
    );

    document.getElementById("menuToggle").addEventListener("click", () => {
        document.getElementById("sidebar").classList.toggle("open");
    });

    document.getElementById("logoutLink").addEventListener("click", event => {
        event.preventDefault();

        localStorage.removeItem("edumatch_token");

        window.location.href = "login.html";
    });

    loadRequests();
</script>

    <script src="../theme.js"></script>
</body>
</html>
